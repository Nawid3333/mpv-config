# Keeps the workflow actions current. They are pinned to a commit SHA with the version
# as a comment; Dependabot updates both. Minor and patch releases come as one grouped
# PR a week, a new major on its own.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ['minor', 'patch']
