name: mpv auto-update

# Offers each new mpv build on ONE rolling pull request once it passed the
# regression suite (pin only since 2026-10-03). mpv's own files are NOT in git:
# mpv-build.json pins one of shinchiro's builds, and installer/install-mpv.ps1 -
# run by updater.bat, and by regression-tests.yml - installs exactly that
# build. The owner's merge moves main's pin; on the PC a `git pull` (updater.bat
# does it) brings it and the install follows.
# Modelled on Nawid3333/FastStream's .github/workflows/mpv-updates.yml, which
# pins its mpv the same way.
#
# History: from 2026-10-01 this workflow committed the whole build (mpv.exe,
# ~118 MB, Git LFS) - first straight onto main, from 2026-10-02 on a pull
# request the owner merged. Every local updater.bat run then left mpv.exe
# changed in git, to be committed and pushed by hand; that is what pin-only ended.
#
# How a run goes (main branch, daily + pushes + by hand, one run at a time):
#
#  1. read shinchiro's latest release and its one mpv-<arch>-...7z asset
#  2. when mpv-build.json already pins it (or newer): nothing to do. Any open
#     "mpv update failed: ..." issue is closed.
#  3. download it, check it against GitHub's sha256 digest, extract it, read
#     the version strings out of mpv.exe, list its files with their sha256 -
#     and refuse a build that ships a file this repo keeps itself
#     (portable_config, .github, tests, ...) or one .gitignore does not cover
#     (it would show up as a new file in the mpv folder after the install).
#  4. commit the new mpv-build.json - and nothing else - on branch `mpv/<tag>`
#     and run regression-tests.yml there (a push by this workflow's own token
#     starts no workflow, so it is dispatched - FastStream's workaround). The
#     suite installs the NEW build with install-mpv.ps1 and runs the static +
#     headless tiers.
#  5. suite passed -> the tested commit goes to branch `mpv-update`, and ONE
#     pull request from it offers the build, assigned to the owner. Nothing
#     merges itself: the headless suite has no GPU, so it cannot see a build
#     that breaks hardware decoding or the renderer (the 20261002+ builds lost
#     the Vulkan device on the owner's GPU, 2026-10-04) - his merge is the step
#     that reaches his PC (updater.bat installs main's pin). The pull request
#     keeps up: a newer build that passes moves the same branch and retitles
#     it. Merged (GitHub deletes the branch), or main pinned to it or past it
#     by hand (closed here), it is done. The mpv/* branches are deleted and an
#     open failure issue is closed. (2026-10-03 to this change, the commit was
#     pushed onto main by this workflow.)
#  6. suite failed -> branch `mpv/<tag>` STAYS as the record that this exact
#     build was tried (a later run will not retry it; deleting the branch, or
#     re-running the workflow, tries it again), and ONE issue, "mpv update
#     failed: <tag>", assigned to and @mentioning the owner so GitHub emails
#     it: opened once, retitled/commented for further reports, closed by
#     whichever run offers a build that passed (or finds main pinning the latest).
#
# The pull request is opened by this workflow's token: the repository setting
# "Allow GitHub Actions to create and approve pull requests" (Settings >
# Actions > General) must be on. No workflow runs on such a pull request; its
# check is the suite run the branch already passed, on the same commit.
#
# This workflow's own failure (no asset found, API down - anything that is not
# a build's test result) leaves no branch: the next run tries again, and the
# "Report this workflow's own failure" step below opens ONE issue, "mpv
# auto-update workflow failed", assigned to the owner.
#
# A pull request that changes this file runs the whole thing as a dry run:
# everything is read, what a real run would do is printed, nothing is pushed,
# started or reported.
#
# Security posture (the same reasoning as FastStream's mpv-updates.yml):
#  - checkout gets persist-credentials: false, so the token is not in
#    .git/config for later steps; every remote git call goes through the
#    authgit() helper, nothing else sees it.
#  - Nothing from outside this run is trusted without a check: the archive
#    against GitHub's own asset digest; install-mpv.ps1 then checks every
#    file it installs against the json, and refuses paths outside the build.
#  - The commits this workflow makes change mpv-build.json and nothing else -
#    never a workflow file, never portable_config. Nothing here edits its own
#    permissions; .github and portable_config changes always need a human.

"on":
  schedule:
    # 02:15 UTC daily. shinchiro's builds come out at about 00:30-01:00 UTC.
    - cron: "15 2 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/mpv-auto-update.yml

permissions:
  contents: write # push mpv/<tag> and mpv-update
  pull-requests: write # the pull request that offers a build
  issues: write # the failure issue
  actions: write # start regression-tests.yml on the branch

concurrency:
  group: mpv-auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Try shinchiro's latest mpv build
    runs-on: ubuntu-latest
    # Its own work is minutes (one ~35 MB download, strings, json). The rest is
    # regression-tests.yml: about 10 minutes on CI plus the wait for a runner.
    # One attempt gets 65 minutes (cancelled and counted as failed after
    # that); two attempts plus this workflow's own work fit in 150.
    timeout-minutes: 150
    steps:
      # persist-credentials: false - the token never lands in .git/config,
      # where any later step could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Offer the latest upstream build on a pull request, if tests pass with it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          UPSTREAM: shinchiro/mpv-winbuild-cmake
          PREFIX: "mpv update failed: "
          # not under mpv/: a passing build deletes every mpv/* branch
          PR_BRANCH: mpv-update
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # --- git with the token, the way actions/checkout does it -----------
          # The header is the only credential; no later step reads .git/config
          # or the environment for one.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          authgit() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          if [ "$EVENT" != pull_request ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run this on main: it reads mpv-build.json there." >&2
            exit 1
          fi
          # main as it is NOW, not the commit this run was queued for: a run that
          # waited behind one that pinned a build (the concurrency group) read the old
          # pin from its own checkout, found the pin branch already deleted, tested the
          # same build again and then failed on "nothing to commit". A dry run reads
          # main's pin as well.
          authgit fetch -q origin main
          if [ "$EVENT" != pull_request ]; then
            git checkout -q --detach origin/main
          fi
          git show origin/main:mpv-build.json > "$RUNNER_TEMP/pinned.json"

          # --- the pin, and shinchiro's latest build --------------------------
          pinned=$(jq -r .tag "$RUNNER_TEMP/pinned.json")
          arch=$(jq -r .arch "$RUNNER_TEMP/pinned.json")
          gh api "repos/$UPSTREAM/releases/latest" > "$RUNNER_TEMP/latest.json"
          latest=$(jq -r .tag_name "$RUNNER_TEMP/latest.json")
          jq --arg a "$arch" '[.assets[] | select(.name | test("^mpv-" + $a + "-[0-9]{8}-git-[0-9a-f]+[.]7z$"))]' \
            "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/asset.json"
          if [ "$(jq length "$RUNNER_TEMP/asset.json")" != 1 ]; then
            echo "Release $latest does not carry exactly one mpv-$arch-<date>-git-<hash>.7z asset. Its assets:" >&2
            jq -r '.assets[].name' "$RUNNER_TEMP/latest.json" >&2
            exit 1
          fi
          asset=$(jq -r '.[0].name' "$RUNNER_TEMP/asset.json")
          asseturl=$(jq -r '.[0].browser_download_url' "$RUNNER_TEMP/asset.json")
          digest=$(jq -r '.[0].digest // ""' "$RUNNER_TEMP/asset.json")
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "$asset has no SHA-256 digest (digest: '$digest')." >&2
            exit 1
          fi
          # Releases are tagged by date, so tags compare as strings.
          if ! [[ $latest =~ ^[0-9]{8}$ && $pinned =~ ^[0-9]{8}$ ]]; then
            echo "Expected dates as release tags: pinned '$pinned', latest '$latest'." >&2
            exit 1
          fi
          branch="mpv/$latest"
          echo "Pinned: $pinned. Latest: $latest, $asset."
          # Tried before: only a build that failed its tests leaves the branch.
          if [ -n "$(authgit ls-remote --heads origin "refs/heads/$branch")" ]; then
            tried=1
          else
            tried=0
          fi

          # The pull request that offers a build: its branch's pin (empty: no
          # branch), and the open pull request from it (empty: none, or the owner
          # closed it - then the next build that passes opens a new one).
          offered=''
          status=0
          authgit ls-remote --exit-code --heads origin "refs/heads/$PR_BRANCH" > /dev/null || status=$?
          case $status in
            0) offered=$(gh api -H 'Accept: application/vnd.github.raw' \
                 "repos/$GH_REPO/contents/mpv-build.json?ref=$PR_BRANCH" | jq -r .tag) ;;
            2) ;;
            *) echo "git ls-remote failed with $status." >&2; exit 1 ;;
          esac
          # gh's --head matches the branch name in any repository: never a fork's.
          pr=$(gh pr list --repo "$GH_REPO" --state open --head "$PR_BRANCH" --base main --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // ""')
          # Waiting there already: the latest build, or a newer one.
          waiting=0
          if [[ $offered =~ ^[0-9]{8}$ ]] && [ "$offered" -ge "$latest" ]; then waiting=1; fi

          # The open failure issue, if any (a list, not a search: the search
          # index lags behind an issue opened minutes ago).
          issue=$(gh issue list --repo "$GH_REPO" --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title | startswith(\"$PREFIX\"))][0].number // \"\"")

          # --- dry run: everything read, nothing done --------------------------
          if [ "$EVENT" = pull_request ]; then
            echo 'Dry run: nothing is pushed, started or reported.'
            if [ "$latest" -le "$pinned" ]; then
              echo "Would do nothing: the pin is on the latest build, or newer."
              if [ -n "$pr" ]; then echo "Would close #$pr: main pins its build already."; fi
            elif [ "$waiting" = 1 ]; then
              echo "Would do nothing: $PR_BRANCH offers $offered already${pr:+ (#$pr)}, for the owner to merge."
            elif [ "$tried" = 1 ]; then
              echo "Would do nothing: branch $branch exists, so $latest failed its tests before."
            else
              echo "Would move mpv-build.json to $latest ($asset) on $branch, dispatch regression-tests.yml there, and offer it on a pull request from $PR_BRANCH if the suite passes."
            fi
            if [ -n "$issue" ]; then echo "Open failure issue: #$issue."; fi
            exit 0
          fi

          # --- one report per failure: ONE open issue, deduped by key ----------
          report() { # <key> <title after the prefix> <body file>
            if [ -n "$issue" ]; then
              texts=$(gh issue view "$issue" --repo "$GH_REPO" --json body,comments --jq '.body, .comments[].body')
              if grep -qF "<!-- mpv-auto-update: $1 -->" <<< "$texts"; then
                echo "Reported on #$issue before: $1."
                return
              fi
            fi
            printf '\n<sub>Reported by %s</sub>\n<!-- mpv-auto-update: %s -->\n' "$RUN_URL" "$1" >> "$3"
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --repo "$GH_REPO" --title "$PREFIX$2" --add-assignee "$OWNER"
              gh issue comment "$issue" --repo "$GH_REPO" --body-file "$3"
            else
              url=$(gh issue create --repo "$GH_REPO" --title "$PREFIX$2" --assignee "$OWNER" --body-file "$3")
              issue=${url##*/}
            fi
          }

          # --- already on the latest build: nothing to do -----------------------
          if [ "$latest" -le "$pinned" ]; then
            echo "The pin is on the latest build already, or newer: $pinned."
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GH_REPO" --comment "main pins $pinned, and shinchiro has no newer build. Closing."
            fi
            # Pinned there by hand meanwhile: the offer has nothing left to merge.
            if [ -n "$pr" ]; then
              gh pr close "$pr" --repo "$GH_REPO" --delete-branch --comment "main pins $pinned already, this build or a newer one: nothing left to merge here."
            fi
            exit 0
          fi
          if [ "$waiting" = 1 ]; then
            echo "$PR_BRANCH offers $offered already${pr:+ (#$pr)}: it waits for the owner's merge."
            exit 0
          fi
          if [ "$tried" = 1 ]; then
            echo "Branch $branch exists: $latest failed its tests before, so it is not tried again."
            exit 0
          fi

          # --- download, digest-check, extract ----------------------------------
          # ubuntu-latest ships 7-Zip; the fallback catches an image change
          # (the repo's own 7z/7zr.exe is a Windows exe, useless here).
          command -v 7z > /dev/null || { echo 'Installing p7zip-full...'; sudo apt-get install -y --no-install-recommends p7zip-full > /dev/null; }
          command -v strings > /dev/null   # binutils; part of the runner image
          rm -rf "$RUNNER_TEMP/x"
          mkdir -p "$RUNNER_TEMP/x"
          gh release download "$latest" --repo "$UPSTREAM" --pattern "$asset" --dir "$RUNNER_TEMP/x"
          got=$(sha256sum "$RUNNER_TEMP/x/$asset" | cut -d' ' -f1)
          if [ "$got" != "${digest#sha256:}" ]; then
            echo "$asset: sha256 $got does not match GitHub's $digest." >&2
            exit 1
          fi
          extract="$RUNNER_TEMP/x/all"
          mkdir -p "$extract"
          7z x -y "-o$extract" "$RUNNER_TEMP/x/$asset" > /dev/null
          if ! [ -f "$extract/mpv.exe" ]; then
            echo "$asset does not contain mpv.exe." >&2
            exit 1
          fi
          # shinchiro's own updater is not part of the build this repo installs:
          # its updater.bat runs installer/update.ps1 (git pull + install-mpv.ps1).
          mapfile -t build_files < <(cd "$extract" && find . -type f | sed 's|^\./||' |
            grep -vxE 'updater\.bat|installer/updater\.ps1' | sort)
          if [ "${#build_files[@]}" -eq 0 ]; then
            echo "No files inside $asset." >&2
            exit 1
          fi
          # The header's promise, enforced: a pinned build never installs over this
          # repo's own config, workflows, hooks or tests, whatever the archive holds
          # (install-mpv.ps1 refuses such a json as well).
          not_ignored=()
          for f in "${build_files[@]}"; do
            case $f in
              portable_config/* | .github/* | .githooks/* | tests/* | lua-api/* | *..*)
                echo "$asset ships $f, which only a person changes here: not pinned." >&2
                exit 1
                ;;
            esac
            git check-ignore -q --no-index -- "$f" || not_ignored+=("$f")
          done
          if [ "${#not_ignored[@]}" -gt 0 ]; then
            echo "$asset ships files .gitignore does not cover: ${not_ignored[*]}" >&2
            echo "They would show up as new files in the mpv folder after the install. Add them to .gitignore (on main), then run this again." >&2
            exit 1
          fi
          # Version strings for the json, read out of the binary: the runner
          # cannot execute a Windows exe (that is what regression-tests.yml
          # does with the installed one); a value that cannot be read refuses
          # the run rather than writing a half-known json.
          version=$(printf '%s' "$asset" | sed -n 's/^mpv-'"$arch"'-[0-9]\{8\}-git-\([0-9a-f]\{6,\}\)\.7z$/\1/p')
          mpv_version=$(strings -a "$extract/mpv.exe" | grep -oaE 'mpv v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[0-9a-f]+' | head -n1 || true)
          mpv_version=${mpv_version#mpv }
          # libplacebo keeps the whole value 'v7.374.0 (v7.360.0-148-g1937bee-dirty)'.
          # The binary carries that exact literal (the 'libplacebo version:' line
          # is a printf format string); the bare vX.Y.Z form is the fallback
          # when a build ships without the parenthetical. Any major from 7 on;
          # mpv's own v0.x never matches.
          libplacebo=$(strings -a "$extract/mpv.exe" | grep -oaE 'v([7-9]|[1-9][0-9])\.[0-9]+\.[0-9]+ \([^)]+\)' | head -n1 || true)
          if [ -z "$libplacebo" ]; then
            libplacebo=$(strings -a "$extract/mpv.exe" | grep -oaE 'v([7-9]|[1-9][0-9])\.[0-9]+\.[0-9]+' | head -n1 || true)
          fi
          # ffmpeg: the binary carries the bare 'N-<rev>-g<hash>' literal.
          ffmpeg=$(strings -a "$extract/mpv.exe" | grep -oaE 'N-[0-9]+-g[0-9a-f]+' | head -n1 || true)
          echo "New build: mpv ${mpv_version:-?} git ${version:-?} libplacebo ${libplacebo:-?} ffmpeg ${ffmpeg:-?}"
          if [ -z "$version" ] || [ -z "$mpv_version" ] || [ -z "$libplacebo" ] || [ -z "$ffmpeg" ]; then
            echo "Could not read the version strings out of $asset; not writing a half-known mpv-build.json." >&2
            exit 1
          fi

          # --- the new pin ---------------------------------------------------------
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          write_json() {
            printf '{\n'
            printf '  "tag": "%s",\n' "$latest"
            printf '  "arch": "%s",\n' "$arch"
            printf '  "asset": "%s",\n' "$asset"
            printf '  "url": "%s",\n' "$asseturl"
            printf '  "sha256": "%s",\n' "$got"
            printf '  "mpv_version": "%s",\n' "$mpv_version"
            printf '  "git": "%s",\n' "$version"
            printf '  "libplacebo": "%s",\n' "$libplacebo"
            printf '  "ffmpeg": "%s",\n' "$ffmpeg"
            printf '  "verified": "%s",\n' "$(date -u +%F)"
            printf '  "upstream_files": {\n'
            local total=${#build_files[@]} i=0 comma sha
            for f in "${build_files[@]}"; do
              i=$((i + 1))
              comma=''; [ "$i" -lt "$total" ] && comma=,
              sha=$(sha256sum "$extract/$f" | cut -d' ' -f1)
              printf '    "%s": "%s"%s\n' "$f" "$sha" "$comma"
            done
            printf '  }\n}\n'
          }
          write_json > "$RUNNER_TEMP/mpv-build.json"
          # commit_pin <base ref>: the new json on top of <base>, and nothing else
          commit_pin() {
            git checkout -q --detach "$1"
            cp "$RUNNER_TEMP/mpv-build.json" mpv-build.json
            git add mpv-build.json
            git commit -q -m "ci: pin mpv $latest (shinchiro)" -- mpv-build.json
            [ "$(git diff --name-only HEAD^ HEAD)" = mpv-build.json ] || { echo 'the pin commit changes more than mpv-build.json' >&2; return 1; }
          }

          authgit fetch -q origin main
          commit_pin origin/main
          commit=$(git rev-parse HEAD)
          authgit push -q origin "$commit:refs/heads/$branch"
          echo "Branch $branch at $commit."

          # regression-tests.yml triggers on pushes to main only, and a push by
          # this workflow's own token starts nothing anyway - so the suite is
          # started by dispatch (FastStream's workaround, same reason).
          if ! gh workflow run regression-tests.yml --ref "$branch"; then
            # A branch whose tests cannot be started is deleted, so the next
            # run tries this build anew instead of counting it as tried.
            authgit push -q origin --delete "$branch"
            exit 1
          fi
          # The dispatch event gives no run id back. The run is the
          # workflow_dispatch one on the branch's own commit.
          run_id=''
          for _ in $(seq 24); do
            sleep 5
            run_id=$(gh run list --repo "$GH_REPO" --workflow regression-tests.yml --branch "$branch" --event workflow_dispatch \
              --json databaseId,headSha --jq "[.[] | select(.headSha == \"$commit\")][0].databaseId // \"\"" || true)
            if [ -n "$run_id" ]; then break; fi
          done
          if [ -z "$run_id" ]; then
            echo "No suite run of $commit appeared within 2 minutes." >&2
            authgit push -q origin --delete "$branch"
            exit 1
          fi
          run_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run_id"
          echo "Suite on $branch: $run_url"

          # --- wait for the suite; rerun its failed jobs once --------------------
          conclusion_of() { # <attempt>
            local seen='' now
            for _ in $(seq 65); do
              sleep 60
              now=$(gh run view "$run_id" --repo "$GH_REPO" --json attempt,status,conclusion \
                --jq '"\(.attempt) \(.status) \(.conclusion)"' || true)
              if [ "$now" != "$seen" ]; then echo "Suite: $now" >&2; seen=$now; fi
              case $now in
                "$1 completed "*) echo "${now##* }"; return ;;
              esac
            done
            echo timed_out
          }
          conclusion=$(conclusion_of 1)
          rerun=0
          if [ "$conclusion" != success ] && [ "$conclusion" != timed_out ] \
            && gh run rerun "$run_id" --repo "$GH_REPO" --failed; then
            rerun=1
            conclusion=$(conclusion_of 2)
          fi
          if [ "$conclusion" = timed_out ]; then
            gh run cancel "$run_id" --repo "$GH_REPO" || true
          fi

          # --- passed: offered on the one pull request, for the owner to merge ----
          # Nothing lands on main here: his merge is a push to main, which runs
          # the suite there and, green, publish.yml - as for any other change.
          if [ "$conclusion" = success ]; then
            authgit push -q -f origin "$commit:refs/heads/$PR_BRANCH"
            title="ci: pin mpv $latest (shinchiro)"
            # shellcheck disable=SC2016 # backticks are Markdown
            {
              printf '@%s shinchiro'"'"'s mpv %s passed the regression suite (%s). **It waits for your merge.**\n\n' "$OWNER" "$latest" "$run_url"
              printf -- '- Release: https://github.com/%s/releases/tag/%s\n' "$UPSTREAM" "$latest"
              printf -- '- The change: `mpv-build.json` pins %s instead of %s, and nothing else.\n' "$latest" "$pinned"
              printf -- '- What the suite does NOT cover: it runs static + headless on a runner with no GPU (`--vo=null`), so hardware decoding (Vulkan, d3d11va) and the renderer are untested. The build reaches your PC when you merge this and run `updater.bat`.\n\n'
              printf 'This pull request keeps up: a newer build that passes moves here, and the title says which. Closing it skips this build; the next one that passes opens a new pull request.\n'
            } > "$RUNNER_TEMP/pr.md"
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --repo "$GH_REPO" --title "$title" --body-file "$RUNNER_TEMP/pr.md" > /dev/null
              echo "#$pr offers $latest now."
            else
              # A branch that offers the build with no pull request would read as
              # "waits for the owner" on every later run, so nobody would ever see it:
              # deleted, and the next run offers the build anew.
              if ! url=$(gh pr create --repo "$GH_REPO" --base main --head "$PR_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr.md" --assignee "$OWNER"); then
                authgit push -q origin --delete "$PR_BRANCH"
                exit 1
              fi
              pr=${url##*/}
              echo "Opened #$pr for $latest."
            fi
            # Failed builds' branches stay until a build passes; every mpv/*
            # branch can go once one has.
            refs=$(authgit ls-remote --heads origin 'refs/heads/mpv/*' | cut -f2)
            if [ -n "$refs" ]; then
              # shellcheck disable=SC2086 # one branch per word
              authgit push -q origin --delete ${refs//refs\/heads\//}
            fi
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GH_REPO" --comment "shinchiro's $latest passed the suite ($run_url): #$pr offers it, for you to merge. Closing."
            fi
          else
            main_ci=$(gh run list --repo "$GH_REPO" --workflow regression-tests.yml --branch main --event push --limit 1 \
              --json conclusion,url --jq '.[0] | "\(if .conclusion == "" then "still running" else .conclusion end), \(.url)"' || echo 'unknown')
            # shellcheck disable=SC2016 # backticks are Markdown
            { printf '@%s mpv %s from shinchiro failed the regression suite on branch `%s` (%s).\n\n' \
                "$OWNER" "$latest" "$branch" "$conclusion"
              if [ "$rerun" = 1 ]; then
                printf 'Its failed jobs were run once more, in case a test was flaky; that ended in %s as well.\n\n' "$conclusion"
              fi
              printf -- '- Suite run: %s\n' "$run_url"
              printf -- '- Branch: `%s`, which is main with only the new pin\n' "$branch"
              printf -- '- Release: https://github.com/%s/releases/tag/%s\n' "$UPSTREAM" "$latest"
              printf -- '- The latest suite run on main: %s. If that failed too, the cause may not be mpv.\n\n' "$main_ci"
              printf 'main keeps pinning %s meanwhile, and updater.bat keeps installing it. Each newer build is tried the day it comes out: one that passes is offered on a pull request for you to merge, and closes this issue. shinchiro keeps only about the 30 newest releases, so a pin left behind for weeks disappears from there - then install-mpv.ps1 cannot download it any more.\n\n' "$pinned"
              printf 'To try %s again: delete ref `%s`, then run the workflow (Actions, mpv auto-update, Run workflow).\n' "$latest" "$branch"
            } > "$RUNNER_TEMP/body.md"
            report "failed $latest" "$latest" "$RUNNER_TEMP/body.md"
          fi

      # A failed run of this workflow is emailed only to whoever started it (for
      # the schedule, to whoever last changed the cron line) - which covers
      # everything that is not a build's test result. One issue while it is
      # open, assigned and @mentioning the owner, like FastStream's failure
      # handling. Not for a pull request's dry run: its failure shows on the
      # pull request.
      - name: Report this workflow's own failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "mpv auto-update workflow failed"
        run: |
          set -euo pipefail
          # When the issues cannot be read, a second issue is better than none.
          number=$(gh issue list --repo "$GH_REPO" --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf '@%s mpv-auto-update.yml failed: %s\n\nThe run log names the failed command. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GH_REPO" --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"
