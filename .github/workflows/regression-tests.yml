name: Regression tests

# Runs tests/run-tests.ps1 - the static checks plus the headless tier (mpv with
# --vo=null --ao=null: every feature driven through mpv's own input commands,
# no window, no GPU) - on every push and pull request that changes more than
# docs, so a config or script edit that breaks a feature turns the run red. See
# tests/README.md. The privacy check (tests/lib/privacy.ps1) runs on every one,
# docs included: the repository is public.
#
# mpv's own files are not in git (pin only, 2026-10-03): the build
# mpv-build.json pins is installed from shinchiro's public release by
# installer/install-mpv.ps1 - the same script updater.bat runs on the PC, so
# every run also proves the installer works on the real archive. If that release
# has been pruned upstream, the latest build of the same arch is tested instead,
# with a warning.
#
# The gpu tier (real renderer, shader cache, switching, frame pacing) needs the
# PC's GPU and display; run it locally: pwsh tests/run-tests.ps1 -Tier gpu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A pull request's newer push cancels its older run. Any other run (main's push, a
# dispatch) has a group of its own and runs to its end: GitHub shows a cancelled run on
# its commit as a red X, like a failure, and two merges minutes apart cancelled the first's.
concurrency:
  group: regression-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs are where a name or a path slips in most easily, so this runs even when the
  # suite is skipped. The hooks (.githooks) stop such a commit before it is pushed; this
  # catches one pushed without them, before it reaches main. The PRIVATE_WORDS secret is
  # the list in the owner's .git/info/private-words; a fork's pull request gets no
  # secrets and is checked without the words.
  privacy:
    name: nothing personal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits a push or pull request brings
          persist-credentials: false

      - name: Every tracked file, the new commits and the branch name (tests/lib/privacy.ps1)
        shell: pwsh
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tests/lib/privacy.ps1
          if (-not $env:PRIVATE_WORDS) {
            Write-Output '::warning title=No PRIVATE_WORDS::The secret is not set for this run (a fork''s or Dependabot''s pull request gets none): the private words are not checked.'
          }
          $words = @("$env:PRIVATE_WORDS" -split '\r?\n' | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          $findings = Get-PrivacyFinding -Root . -Words $words
          # A pull request's own commits; a push's (to main: the only branch a push runs this
          # for) since the commit before it - with no such commit here (a force push), all of
          # main's history, whose messages and identities take seconds. A run by hand: the
          # files only.
          $range = switch ($env:EVENT) {
            'pull_request' { "$env:BASE..$env:HEAD" }
            'push' { git cat-file -e "$env:BEFORE^{commit}" 2>$null; $LASTEXITCODE ? $env:AFTER : "$env:BEFORE..$env:AFTER" }
          }
          if ($range) {
            foreach ($kv in (Get-CommitFinding -Root . -Range $range -Words $words).GetEnumerator()) { $findings[$kv.Key] = $kv.Value }
          }
          if ($env:HEAD_REF) {
            # (a ref name cannot hold a user folder path, but an e-mail address or a claude.ai link it can)
            $mails = @([regex]::Matches($env:HEAD_REF, '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}') |
                Where-Object { $_.Value -notmatch '(noreply@anthropic\.com|noreply@github\.com|support@github\.com|@users\.noreply\.github\.com|@example\.(com|org))$' })
            $named = @($words | Where-Object { $env:HEAD_REF.IndexOf($_, [StringComparison]::OrdinalIgnoreCase) -ge 0 })
            $link = $env:HEAD_REF -match $PrivatePathRegex
            $findings['the branch name holds no private word, e-mail address or claude.ai link'] = @(if ($mails.Count -or $named.Count -or $link) { 'the head branch' })
          }
          $found = 0
          # file:line or a short sha only, never the text: this log is public
          foreach ($kv in $findings.GetEnumerator()) {
            if ($kv.Value.Count) {
              $found++
              Write-Output "::error title=Privacy::$($kv.Key) - found in: $($kv.Value -join ', ')"
            }
            else { Write-Output "ok: $($kv.Key)" }
          }
          exit $found

  # A change to docs only (*.md, doc/) skips the suite: no test reads them, and the
  # Windows run takes minutes. The run still ends green. Anything else - and a run by
  # hand, a re-run, or a push with no passed run on main before it - runs the suite.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the runs of this workflow on main (below)
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: More than docs?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          range=''
          if [ "$EVENT" = pull_request ]; then
            # the whole pull request: a run a newer push cancelled is covered by this one
            range="$BASE...$HEAD"
          elif [ "$EVENT" = push ]; then
            # From the newest commit whose run of this workflow passed, not the push's own
            # "before": a newer push cancels a running suite (cancel-in-progress), and that
            # commit was never tested - it stays in the range, and the suite runs for it. A run
            # of that very commit (a re-run by hand) has no range: it is tested again.
            last=$(gh run list --workflow regression-tests.yml --branch "$BRANCH" --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
            if [ -n "$last" ] && [ "$last" != "$AFTER" ] && git merge-base --is-ancestor "$last" "$AFTER" 2>/dev/null; then
              range="$last..$AFTER"
            fi
          fi
          # A diff that fails (a base commit no longer there) counts as code: only grep's
          # "no line left" may be read as docs-only, never an error of git's.
          if [ -z "$range" ] || ! files=$(git diff --name-only "$range"); then
            code=true
            echo "No range to compare ($EVENT${range:+, $range failed}): the suite runs." >> "$GITHUB_STEP_SUMMARY"
          else
            others=$(printf '%s\n' "$files" | grep -Ev '(\.md$)|(^doc/)|(^$)' || true)
            if [ -n "$others" ]; then
              code=true
              { echo "Changed beyond docs: the suite runs."; echo '```'; echo "$others" | head -50; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            else
              code=false
              echo "Docs only (*.md, doc/): the suite is skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Three runners at once (2026-10-24; one job took about 7 minutes): the static checks, and the
  # headless tests in two shards that run-tests.ps1 computes from the full list (-Shard i/n,
  # Get-ShardPlan), so a new test always lands in exactly one. Each runner still runs one mpv
  # at a time: the timing-sensitive tests see what they saw in one job. fail-fast off: a red
  # shard never cancels the others' checks.
  headless:
    name: ${{ matrix.part == 'static' && 'static checks' || format('headless {0}', matrix.part) }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [static, '1/2', '2/2']
    steps:
      # lfs: false (default) - no LFS quota; install-mpv.ps1 finds the runner's 7-Zip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # each shard installs it: every run proves install-mpv.ps1 on the real archive
      - name: Install the pinned mpv build (installer/install-mpv.ps1)
        if: matrix.part != 'static'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:RUNNER_TEMP 'mpv'
          New-Item -ItemType Directory -Force $bin | Out-Null
          ./installer/install-mpv.ps1 -Root $bin -BuildJson ./mpv-build.json
          $rc = $LASTEXITCODE
          # Only a download that fails (exit 2) falls back to the latest build (shinchiro keeps
          # about 30 days of releases): a file that is not the pinned one fails, and an update
          # branch (mpv/<tag>, mpv-auto-update.yml) tests exactly the build it pins or nothing.
          if ($rc -eq 2 -and $env:GITHUB_REF_NAME -notlike 'mpv/*') {
            $build = Get-Content mpv-build.json -Raw | ConvertFrom-Json
            Write-Output "::warning title=Pinned mpv build unavailable::$($build.tag) could not be downloaded - testing the latest $($build.arch) build instead."
            $dir = Join-Path $env:RUNNER_TEMP 'mpv-download'
            New-Item -ItemType Directory -Force $dir | Out-Null
            gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-$($build.arch)-*-git-*.7z" --dir $dir
            if ($LASTEXITCODE) { throw 'could not download any mpv build' }
            $archive = (Get-ChildItem $dir -Filter *.7z | Select-Object -First 1).FullName
            7z e -y "-o$bin" $archive mpv.exe | Out-Null
            if ($LASTEXITCODE) { throw "7z failed ($LASTEXITCODE)" }
            Write-Output "Testing $(Split-Path -Leaf $archive)"
          }
          elseif ($rc -ne 0) {
            throw "install-mpv.ps1 failed (exit $rc)"
          }
          "MPV_EXE=$(Join-Path $bin 'mpv.exe')" >> $env:GITHUB_ENV

      - name: Static checks
        if: matrix.part == 'static'
        shell: pwsh
        run: ./tests/run-tests.ps1 -Tier static -WorkDir (Join-Path $env:RUNNER_TEMP 'mpv-regression')

      - name: Headless tests, shard ${{ matrix.part }}
        if: matrix.part != 'static'
        shell: pwsh
        env:
          PART: ${{ matrix.part }}
        run: ./tests/run-tests.ps1 -MpvExe $env:MPV_EXE -WorkDir (Join-Path $env:RUNNER_TEMP 'mpv-regression') -Shard $env:PART

      - name: Upload mpv logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mpv-regression-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mpv-regression/logs
          if-no-files-found: ignore
          retention-days: 14
