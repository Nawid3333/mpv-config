# mpv.conf - main configuration (built in phases: 1 speed keys, 2 UI, 3 GPU)
# Phase 3 appended the GPU-quality sections below.

# ---- SUBTITLES: auto-load next to the video so the c key is rarely needed ----
# fuzzy: any sub whose filename contains the video filename (exact is default)
sub-auto=fuzzy
# also scan these subfolders next to the video (relative to video dir). On
# Windows a path list is split on ';' - with ':' (Unix) the one folder looked
# in was "sub:subtitles" and no subfolder was ever scanned (2026-10-10).
sub-file-paths=sub;subtitles

# Scripts/bottom-bar.lua lifts ASS and picture subtitles above uosc's controls
# while they show, through sub-pos; a "Quit & save position" in that moment
# would store the lifted value for the file. sub-pos is therefore not part of
# the per-file watch-later state (every other default stays).
watch-later-options-remove=sub-pos

# ---- LANGUAGE AUTO-PICK for embedded tracks ----
# A per-PC setting since 2026-10-09: right-click menu > Settings > Subtitle /
# Audio language (Scripts/settings.lua, ~~state/settings.json). It was
# slang=de,en / alang=de,en here - the owner's languages, for everyone. A PC
# that ran this config before keeps those; a new install starts from mpv's own
# defaults: subtitles in Windows' language when the audio is another one
# (subs-match-os-language), the file's default audio track.

# ---- MISC ----
# keep mpv open with the UI when a file ends (playlist-friendly, uosc wants this)
keep-open=yes
# keep the window open when mpv is started without a file, instead of exiting instantly
idle=yes

# ---- UI: uosc (phase 2) ----
# uosc draws timeline/controls/top bar itself:
osc=no
osd-bar=no
# Native Windows title bar in windowed mode (2026-09-26, at the user's request:
# "normal Windows 11 window management"). Windows itself then handles the
# window: drag the title bar to move it, drag to the top edge to maximize (or
# the Snap bar, per Settings > System > Multitasking), to a side/corner to snap
# half/quarter, hover the maximize button for Snap Layouts (Win+Z), double-click
# the title bar to maximize/restore, drag a maximized window down to restore.
# None of that can come from uosc's own top bar: Snap Layouts and snap-drag need
# the system caption (WM_NCHITTEST answering HTCAPTION/HTMAXBUTTON - see
# learn.microsoft.com "Support snap layouts for desktop apps"), and with
# border=no mpv answers only resize edges and client area. mpv colours the bar
# by the Windows dark/light setting and keeps the rounded corners. uosc hides
# its own top bar while the native one shows (uosc.conf top_bar=no-border), so
# there is never a double bar; fullscreen has no bar, as before. (Until
# 2026-09-26 this was border=no: uosc drew the window controls.)
border=yes
# No click-and-drag window moving on the VIDEO (2026-09-26, at the user's
# request): the video area is a play/pause button only; the window moves by its
# title bar (above) or PowerToys GrabAndMove (Alt+drag). With mpv's
# default window-dragging=yes, a left press that moved 3 px
# (--input-dragging-deadzone) before release was taken as a drag and the click
# was DROPPED - input.c cancels the pending MBTN_LEFT before asking the VO to
# drag, and in fullscreen the VO then refuses the drag, so nothing happened at
# all. On this 2560x1440 display with a 1:1 pointer, 3 px is a fraction of a
# millimetre of hand movement: that was the "click sometimes does nothing".
# Measured with mpv's own mouse/keydown/keyup commands: 3, 6 and 15 px of
# movement lost the click with dragging on and toggled pause with it off.
# Dragging the title bar and resizing at the edges are Windows' own (non-client
# area): this option does not touch them.
window-dragging=no
# seek feedback as text (the OSD bar is disabled above)
osd-on-seek=msg
# ---- OSD TEXT: the same look as the banners (2026-09-26) ----
# Every message this setup's scripts show is a small banner top right, drawn by
# Scripts/notify.lua in the shader bar's design (the user asked for one design
# language). mpv's OWN text - menu actions (Contrast +, Loop, Screenshot ...),
# show-text from vendored scripts - cannot go through that script (no script
# sees it), so it is styled to match here: the banners' black box (the built-in
# osd-box profile = a libass background box; osd-back-color solid OLED black
# like the banners - mpv's default is #AF000000, 69 %), top right, the banner
# title's size, on screen as long as a banner. notify.lua moves it under any
# banner that is showing (osd-margin-y-offset), so the two never overlap; uosc.conf
# adjust_osd_margins=no keeps uosc from moving it as well. uosc itself is not
# affected: it resets every drawing to the Default style (\rDefault), which
# these options do not touch - notify.lua and subtitle-sync.lua do the same.
# Sizes are scaled pixels (at a 720-line window, like the banners' canvas):
# box = text + osd-shadow-offset on each side, so margin = banner edge + 7.
profile=osd-box
# One typeface for the whole interface (2026-10-02, design pass): Segoe UI,
# Windows 11's own UI font, ships with every Windows 10/11. uosc reads this
# option for all its text (menus, timeline, tooltips), and every script-drawn
# panel and banner inherits it through the Default style, so the player's UI,
# mpv's own OSD text and the Windows title bar above it share one typeface.
# Before, nothing was set: mpv's "sans-serif" became Arial through libass's
# DirectWrite substitution. Subtitles are untouched (sub-font is separate).
# The static Segoe UI, not Windows 11's variable "Segoe UI Variable": libass
# picks named instances of variable fonts unreliably.
osd-font=Segoe UI
# black, fully opaque (gray/alpha form: a # would start a comment in this file
# - "osd-back-color=#FF000000" is read as empty and rejected)
osd-back-color=0.0/1.0
# 17 = the banners' title size 14 x 1.19 (Segoe UI's taller line box, see
# osd-font above; notify.lua's FONT_SCALE). notify.lua rewrites the size, the
# box padding and the margins in real pixels as soon as there is a window.
osd-font-size=17
osd-shadow-offset=7
osd-align-x=right
osd-align-y=top
# banner stack: 14 from the right, top at 46 (below uosc's top bar). x is 22,
# not 21: libass's box reaches ~1.5 past the text on the right (measured on a
# 2560x1440 screenshot: 3 px further right than the banners with 21).
osd-margin-x=22
osd-margin-y=53
osd-duration=2000
# uosc's own `autohide=yes` (script-opts/uosc.conf) ties UI visibility to this
# timer: UI shows on mouse movement, hides after the cursor sits still this
# long, like a normal player instead of staying permanently on screen.
cursor-autohide=1000
# video-sync=audio (mpv's own default) - NOT display-resample - as of
# 2026-09-13, see AGENTS.md's "VRR audit" section. This display has FreeSync
# confirmed on; display-resample actively fights variable refresh (it forces
# presentation to a fixed detected-Hz cadence so it can duplicate/resample
# frames onto it, which is the opposite of what VRR wants and what defeats
# AMD's Low Framerate Compensation for sub-VRR-floor content like 24fps
# movies - see mpv issues #12005/#12338 and the LFC mechanics in AGENTS.md).
# uosc's older "smoother UI" recommendation for display-resample predates
# this display having VRR; audio + real VRR is smoother still, not a
# regression. Frame interpolation (RIFE) was removed from this config
# 2026-09-20; VRR is the only judder smoothing in play.
# MEASURED 2026-10-09 (PresentMon, when each frame reached the screen): VRR
# reaches mpv only in FULLSCREEN, and only with an AMD Adrenalin per-app
# profile for mpv.exe set to "AMD FreeSync: On" - under the default "AMD
# Optimized" (FreeSync for games AMD knows) every frame landed on the fixed
# 144 Hz grid, windowed and fullscreen. On that grid 23.976 fps is even (6
# refreshes, a 7th every ~40 s) but 25 fps alternates 41.7/34.7 ms, 30 fps
# 34.7/27.8, 60 fps 13.9/20.8 (judder). With the profile set to On, fullscreen
# 25 fps showed 40.0 ms frames and 60 fps 16.7 ms; windowed stays on the grid.
# One weak spot: a fresh mpv started directly in fullscreen a few seconds after
# the last one closed stayed on the grid in 3 of 5 tries (fullscreen switched on
# while playing, and the next file in the same window, worked every time).
video-sync=audio

# ============================================================================
# GPU QUALITY (phase 3) - anime + movies on RX 9070 XT, gpu-next/libplacebo
# ============================================================================
# vo=gpu-next set EXPLICITLY (2026-09-14). It is already the default in this
# build, but the manual says in as many words that the default VO "is subject
# to change, and must not be relied upon" - and several decisions in this file
# are correct only under gpu-next specifically: tone-mapping left on auto
# (resolves to the spline curve on gpu-next, but to the older bt.2390 on
# plain gpu), hdr-compute-peak, target-peak's libplacebo tone-mapping path,
# and gpu-next-only defaults. Naming it here means a future
# default change cannot silently move this config onto a different renderer.
vo=gpu-next
# Built-in high-quality profile of this build = scale=ewa_lanczossharp,
# scale-antiring=0.6 + two HDR tweaks. Loading it as a profile here sets the
# scalers for everything the GLSL shaders do NOT touch (their final pass
# still needs a base scaler, and chroma/dscale are independent).
profile=high-quality

# HDR tone-mapping (2026-09-13 audit, see AGENTS.md's "VRR audit" section for
# the full writeup - user confirmed HDR is actually used on this display).
# tone-mapping itself is left unset/auto deliberately: on --vo=gpu-next
# specifically (this config), auto already resolves to the "spline" curve,
# not the older bt.2390 default gpu (non-next) uses - already correct.
# hdr-compute-peak (dynamic per-frame HDR peak detection) also already
# auto-enables itself given RDNA4's compute shader support; set explicitly
# below only for certainty, not because auto was wrong.
hdr-compute-peak=yes
# target-peak: identified the exact monitor (LG 27GN800-B, from its EDID
# manufacturer/product ID via Windows WMI) and found its real brightness two
# independent ways - the official LG-authorized datasheet ("350 cd/m2
# typical", no separate HDR figure - this model has no VESA DisplayHDR
# certification, no local dimming; "HDR10 support" just means it accepts an
# HDR10 signal on the same ~350-nit SDR-range panel) and this exact unit's
# own EDID CTA-861 HDR static metadata block (max luminance 351.25 cd/m2) -
# both landing on the same number independently is why this is set to a
# real figure rather than a guessed/generic one. Without this, mpv tone-maps
# assuming a generic/unknown target and leaves the display's own (here,
# mediocre - no local dimming) passthrough handling to do the rest; with it,
# libplacebo's tone-mapping (spline curve, see above) compresses highlights
# to what this panel can actually reproduce before the signal ever reaches
# it. target-trc/target-prim/target-contrast and the finer peak-detection
# knobs (hdr-peak-percentile, hdr-contrast-recovery) are deliberately left
# at mpv's defaults - community guides suggest specific numbers for those,
# but none were independently verifiable for this exact panel the way
# target-peak was, and getting them wrong is a "looks worse" risk only a
# human eye can catch. See AGENTS.md.
# 2026-10-09: a per-PC setting - right-click menu > Settings > HDR brightness
# (Scripts/settings.lua; 350 stays on a PC that ran this config before, a new
# install starts at mpv's auto). That script sets target-peak while an HDR
# (PQ/HLG) video plays and auto for everything else, as the [hdr-target-peak]
# profile at the end of this file did from 2026-10-02 to 2026-10-09.
# 2026-10-02: applied to HDR SOURCES ONLY. Set globally it also applied to every SDR video on the
# SDR desktop, where the manual warns it "causes the display to be treated as
# if it were an HDR display in disguise": libplacebo then placed SDR white at
# 203 of 350 nits. Measured in the real renderer (gpu-next, this config, a
# grey ramp 0/64/128/191/255, the pixels presented on screen): 0/51/101/150/201
# - and 0/33/67/99/133 when Windows reports its default SDR white level of 80
# nits (winvk passes it to mpv as the SDR reference white): every SDR picture
# at 52-78 % signal. HDR files are unchanged by moving it into the profile
# (measured identical, pixel for pixel). With Windows HDR on, mpv's
# colour-space hint uses this option in place of the display's reported peak
# for HDR files, exactly as before; SDR files then sit at Windows' SDR
# brightness level, below either peak.

# deband ON by default (anime banding fix; cheap). Toggleable in the
# uosc menu (Video > Deband) or by adding a 'cycle deband' keybind.
deband=yes

# Film grain: WHERE the codec's own film-grain metadata (AV1, H.274) gets
# applied, not whether. Values are auto|cpu|gpu - not yes/no; the old comment
# here described a yes/no "grain synthesis" toggle that this option has never
# been. `auto` means gpu when the VO supports it (only gpu-next does, which
# is why vo is pinned above) and cpu otherwise, which also cuts frame copies
# under hardware decoding. Purely a performance knob - the picture is the
# same either way, so there is nothing to tune here for looks.
vd-lavc-film-grain=auto

# ============================================================================
# GPU CONTEXT: Vulkan, not D3D11 (2026-09-13 fix - see AGENTS.md's
# "upscale presets took 10-20+ seconds to apply" section)
# ============================================================================
# gpu-next/libplacebo defaulted to the d3d11 GPU context on this system
# (a consequence of hwdec=d3d11va), which compiles the heavy CNN shaders
# (Anime4K restore/upscale chains, ArtCNN) via an HLSL->DXBC cross-compile
# step that measured 10-20+ SECONDS per shader on this RX 9070 XT - every
# upscale preset switch stalled the player for that long, which is almost
# certainly what "upscaling doesn't work" actually was. Forcing the native
# Vulkan context (winvk) compiles the same shaders (GLSL->SPIR-V only, no
# HLSL/DXBC step) in well under a second - confirmed by cycling all four
# upscale presets back-to-back with no stall. Vulkan is also simply the
# right fit for this GPU/driver in general, not just for this bug.
# 2026-10-09: d3d11 as the fallback, for a PC without a working Vulkan driver
# (the one-click install is for other PCs): mpv takes the first context of the
# list that starts, so here it is winvk as before; elsewhere a picture with
# slow first shader compiles beats no picture at all.
gpu-context=winvk,d3d11

# hwdec is D3D11 (d3d11va-copy) for EVERYTHING - local files, other URLs and
# FastStream streams alike - and no Vulkan video decoding anywhere, since
# 2026-10-04. Keep it that way: the d3d11va-copy decode + Vulkan render
# (gpu-context=winvk above) pair is the one this PC has played every local
# file with since 2026-09-16, and the two are independent (decode on the
# video engine through D3D11, copy, render on Vulkan).
#
# Why vulkan decode is gone for FastStream streams too (2026-10-04, live): a
# FastStream stream started through the helper, with the then-[faststream-hwdec]
# profile picking hwdec=vulkan, logged `vd: Looking at hwdec h264-vulkan`, then
# 2.5 s later `ffmpeg: Unable to submit command buffer: VK_ERROR_DEVICE_LOST`
# and `vo/gpu-next/libplacebo: Failed acquiring swapchain image:
# VK_ERROR_DEVICE_LOST`: the GPU device was lost, the window went (the sound
# could go on with no window, not even in the taskbar), the display's HDR
# indicator flickered, AMD's bug report tool came up, and a repeat left the
# RX 9070 XT's driver failed to load until a restart. Same driver (Adrenalin,
# 2026-08-17) and Windows as before; what changed were the daily mpv builds
# (FFmpeg N-127087 on 20261002, N-127117, N-127165 on 20261004) - the profile
# had worked since 2026-09-16 with older builds. A device loss is not a
# decode failure mpv can fall back from, so a fallback list cannot catch it.
# tests/run-tests.ps1 refuses any hwdec with vulkan in this file.
#
# History: vulkan was the default from 2026-09-13 to 2026-09-16 (ffmpeg can
# decode straight onto a Vulkan image via VK_KHR_video_decode_*, zero-copy
# with the Vulkan VO - confirmed via hwdec-current=vulkan AND
# hwdec-interop=vulkan on real decoded video), then FastStream-only until
# 2026-10-04 for the local-file reason below.
#
# Root-caused 2026-09-16: a real local file (a yt-dlp-downloaded 1080p AV1
# mp4, 693kbps, 54 minutes) reproducibly dropped frames and hit WASAPI audio
# underruns/A-V desync from the first second under hwdec=vulkan - confirmed
# NOT the upscale shaders (identical with gpu-toggles.lua's whole file
# removed from Scripts/, so no shader code ran at all) and NOT generic
# AV1-via-vulkan (a synthetic AV1 clip of the same resolution/codec, and a
# 15s excerpt of the SAME file's bitstream via stream copy, both played
# clean under hwdec=vulkan - only the real, full, 54-minute file triggers
# it). hwdec=d3d11va-copy and hwdec=no both played the same full real file
# cleanly. This points at a startup-timing race in this driver's Vulkan
# video decode session init that only surfaces when opening a large/long
# local file adds enough up-front delay to expose it - not something a
# fallback list can catch (vulkan reports successful init - hwdec-current
# does read back "vulkan" - it just then performs badly on real playback,
# and mpv's hwdec fallback list only reacts to init failure, not runtime
# drops). Since the failure needs a real large local file to reproduce,
# re-verify against an actual local video (not a short/synthetic one) if
# this is ever revisited.
hwdec=d3d11va-copy,no

# ============================================================================
# SHADER COMPILE CACHING (already on, documented here so it isn't a mystery)
# ============================================================================
# gpu-shader-cache defaults to yes and, because this is a portable_config
# install, mpv already writes its compiled-shader cache into THIS folder
# (portable_config/cache/shader_*, gitignored - see the mpv manual's "FILES
# ON WINDOWS" section: cache files go to portable_config when it exists,
# not %LOCALAPPDATA%). Nothing to configure - it was already active the
# whole time the "10-20s per preset switch" bug (see AGENTS.md) was
# happening; that bug was the D3D11 HLSL->DXBC translation step specifically
# (not covered by this cache, which stores the GLSL->SPIR-V result), so no
# cache setting would have fixed it - only the gpu-context=winvk switch
# above did. Under Vulkan, this cache means even the FIRST-ever compile of
# each shader is a one-time-per-machine cost (well under a second already,
# see AGENTS.md's 2026-09-13 section) - every switch after that, including
# after restarting mpv, hits the on-disk cache directly. Confirmed 2026-09-13
# by cycling all four upscale presets in real fullscreen at this display's
# actual 2560x1440@144Hz, twice (720p and 1080p sources): zero recompiles,
# ~16MB of cache total - nowhere near gpu-next's 128MiB auto-eviction limit.
# If shader edits ever stop taking effect, this is the cache to clear
# (delete portable_config/cache/shader_* - safe, just forces one recompile).

# ============================================================================
# HLS / NETWORK STREAM SMOOTHNESS (phase 6, 2026-09-12)
# ============================================================================
# IMPORTANT: the GLSL shaders above (Anime4K/ArtCNN/FSRCNNX) run in the GPU
# render pipeline AT DISPLAY TIME, one frame at a time - mpv has no concept
# of a pre-shaded frame queue, so upscaling cannot literally be "applied to
# the prefetched segments" ahead of time. What actually helps smoothness for
# HLS is (a) buffering more of the network stream ahead so a slow segment
# fetch doesn't stall playback, and (b) giving the GPU more frames of
# pipelining headroom so an occasional slow decode/shader frame doesn't miss
# a vsync. Both are cheap given spare RAM/VRAM, which is what these do:
#
# (a) network buffering (system RAM, not VRAM):
# 2026-10-09: the size and the waits are a per-PC setting - right-click menu >
# Settings > Buffering / Start and stalls (Scripts/settings.lua), also offered
# in the Welcome menu (F1): 150 MB, 512 MB, 1 GB, 2 GB or the whole video on
# disk; Auto recommends by the PC's memory. The values below are the tuned ones,
# which a PC that ran this config before keeps; settings.lua sets them at start.
# cache=auto already treats HLS as a network stream; set explicitly so this
# doesn't depend on protocol-detection heuristics after yt-dlp resolves it.
cache=yes
# 150MiB default caps how far ahead the demuxer can buffer regardless of
# --cache-secs; raised so more of the stream sits in RAM ahead of playback.
# 1GiB since 2026-09-21 (was 512MiB): at a typical 1080p movie stream bitrate
# (~12 Mbps) that is ~11 minutes ahead instead of ~6. It is only a ceiling -
# RAM is used as the stream actually fills it (this PC has 63 GB) - and it holds
# COMPRESSED packets, so it lives in system RAM, never VRAM; the upscale
# shaders do not touch it (they run per displayed frame, see (c) below).
demuxer-max-bytes=1GiB
# back buffer (for instant back-seeks within the cached range); default 50MiB.
demuxer-max-back-bytes=128MiB
# wait for a few seconds of buffer before starting, and re-buffer the same
# amount after a stall, instead of resuming immediately and re-stalling on
# the next segment (default cache-pause-wait is 1s, cache-pause-initial=no).
# mpv applies cache-pause-initial after every SEEK as well; settings.lua turns
# it off once a file has started (2026-10-09), so a seek plays at once.
cache-pause-initial=yes
cache-pause-wait=3
#
# (b) GPU frame pipelining (VRAM):
# more in-flight frames the VO can queue for presentation = more headroom
# against one slow frame (heavy shader chain, decode hiccup) before a vsync
# is missed. Costs a couple extra frames of latency and a modest amount of
# VRAM. Default is 2.
swapchain-depth=4
#
# (c) what buffering does NOT affect, checked 2026-09-16 (natural follow-up:
# "does more buffering speed up skipping / high-speed playback / upscaling"):
# - Skip keys are RELATIVE seeks. --hr-seek defaults to "default" (precise
#   seeking only for absolute seeks like chapter jumps), so a plain relative
#   seek snaps to the nearest keyframe - see the manual's --hr-seek. A
#   keyframe-snap seek on a local file is already near-instant (index lookup
#   + one demux seek, no forward decode) regardless of cache size - cache
#   size only matters for a NETWORK seek
#   into a not-yet-fetched region, which (a) above already covers. Bigger
#   buffers don't make a local skip faster; it's already as fast as this
#   seek mode gets.
# - Playback speed (5x-16x, the h/e/a/etc. speed keys) is bottlenecked by
#   decoder+shader throughput - how many frames/sec this GPU can decode and
#   run the upscale/deband passes on - not by how much compressed data sits
#   in RAM ahead of the decoder. framedrop=vo (mpv's own recommended
#   default, left unset here on purpose - see manual's --framedrop) already
#   does the right thing at high speed: decode and filter every frame, drop
#   only late ones at the VO so audio stays in sync. More buffering doesn't
#   raise that throughput ceiling.
# - A GPU-side decode-ahead queue (--vd-queue-enable) was considered and
#   deliberately left off/unset: the manual states outright it "should not
#   be used with hardware decoding" (this config decodes in hardware:
#   d3d11va-copy for everything, see the hwdec section) and is "probably quite
#   pointless" anyway since libavcodec
#   already decodes multithreaded. Enabling it here would fight the
#   existing hwdec path, not help it.
# Net: (a)/(b) are already tuned for what buffering actually controls
# (network stall avoidance, GPU presentation headroom - and (a) is RAM,
# (b) is VRAM, not interchangeable - see their labels above). Upscale cost
# and skip/speed throughput live elsewhere in this file (gpu-context,
# hwdec, the shader presets themselves) and are not buffering problems, so
# there is nothing to tune here for them specifically.

# ============================================================================
# PROFILES - MUST STAY AT THE END OF THIS FILE
# ============================================================================
# Everything after a [section] header belongs to that profile until the next
# header. The [faststream-hwdec] profile used to sit in the middle of this file
# (2026-09-16 to 2026-09-21), which silently made every option below it - the
# whole HLS/network buffering block (cache, demuxer-max-bytes, cache-pause-*)
# and swapchain-depth - apply ONLY to FastStream streams; local files and other
# URLs ran on mpv's defaults. Any new global option goes ABOVE this block.
# ([faststream-hwdec], which gave FastStream streams hwdec=vulkan, was removed
# on 2026-10-04: see the hwdec section - it lost the GPU device.)

# (No profile left since 2026-10-09: [hdr-target-peak], which set target-peak=350
# for HDR sources, became the HDR brightness setting - Scripts/settings.lua.)
