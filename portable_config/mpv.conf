# mpv.conf - global options. Per-PC choices (languages, buffering, HDR brightness)
# are set by Scripts/settings.lua, per-file buffering by Scripts/stream-buffer.lua.
# A '#' starts a comment anywhere on a line - also inside a value.

# ---- Subtitles ----
# load every subtitle whose name contains the video's name
sub-auto=fuzzy
# also look in these subfolders (Windows splits path lists on ';')
sub-file-paths=sub;subtitles
# bottom-bar.lua lifts subtitles through sub-pos while uosc's bar shows; a
# "Quit & save position" must not store that lifted value for the file
watch-later-options-remove=sub-pos

# ---- Keys ----
# mpv's own key bindings off: a key does only what input.conf says, so that file lists
# every key there is (it binds the basics itself: quit, the window's close button,
# fullscreen, the media keys). Scripts' forced keys (uosc's menus, the sync panel) stay.
input-default-bindings=no

# ---- Window and UI (uosc) ----
keep-open=yes
idle=yes
# uosc draws the timeline and the controls
osc=no
osd-bar=no
# mpv's auto_profiles script is not loaded: no profile here has a profile-cond, so it
# only registered its hooks and unloaded itself, and a hook mpv sent it in that moment
# went unanswered ("client removed during hook handling", the config-load check's CI
# flake). A conditional profile needs this back at auto (the static tier checks the pair).
load-auto-profiles=no
# The native title bar: Windows itself moves and snaps the window (Snap Layouts
# need the system caption, which no bar drawn by uosc can provide). uosc hides
# its own top bar while this one shows (uosc.conf top_bar=no-border).
border=yes
# A click on the video only toggles pause: with dragging on, a press that moved
# 3 px became a window drag and the click was dropped (in fullscreen nothing
# happened at all).
window-dragging=no
osd-on-seek=msg

# mpv's OWN OSD text (menu actions, vendored scripts' show-text) looks like
# notify.lua's banners: a black box (osd-box), top right, the banner title's
# size. notify.lua rewrites size, padding and margins in real pixels once there
# is a window and moves the text below the banners (osd-margin-y-offset);
# uosc.conf adjust_osd_margins=no keeps uosc from moving it too. uosc and the
# script overlays start each drawing with \rDefault, so none of this restyles them.
profile=osd-box
# Segoe UI for the whole UI: uosc reads this option, script overlays inherit it.
# The static family, not "Segoe UI Variable": libass picks named instances of
# variable fonts unreliably. Subtitles use sub-font.
osd-font=Segoe UI
# opaque black (gray/alpha: "#FF000000" would be cut off as a comment)
osd-back-color=0.0/1.0
# 14 x 1.19: Segoe UI's line box is 1.19x Arial's (notify.lua FONT_SCALE,
# uosc.conf font_scale)
osd-font-size=17
osd-shadow-offset=7
osd-align-x=right
osd-align-y=top
# the banners sit 14 from the right edge and 46 from the top; + the 7 of box
# padding, and x + 1 more because libass's box reaches ~1.5 px past the text
osd-margin-x=22
osd-margin-y=53
osd-duration=2000
# uosc's autohide follows this timer
cursor-autohide=1000
# Judder is smoothed by the display's VRR, not by mpv: display-resample forces a
# fixed cadence and works against FreeSync. VRR reaches mpv only in fullscreen,
# and only with an Adrenalin per-app profile for mpv.exe set to "AMD FreeSync:
# On" (measured with PresentMon; under "AMD Optimized" every frame landed on the
# fixed 144 Hz grid).
video-sync=audio

# ---- Rendering ----
# Pinned: the default VO may change, and choices here assume gpu-next
# (tone-mapping auto = spline, hdr-compute-peak, film grain on the GPU).
vo=gpu-next
# the base scalers for everything the upscale shaders do not touch
profile=high-quality
# per-frame HDR peak detection. target-peak is set by settings.lua (HDR
# brightness, per screen) only while a PQ/HLG video plays: set globally it would
# dim every SDR video (SDR white would sit at 203 of the peak's nits).
hdr-compute-peak=yes
# against banding in anime; cheap. Video > Deband toggles it.
deband=yes
# where AV1/H.274 film grain is applied (on the GPU with gpu-next); the picture
# is the same either way
vd-lavc-film-grain=auto
# Vulkan: D3D11 cross-compiles the large CNN shaders through HLSL/DXBC, which
# took 10-20 s per shader on this card. D3D11 only where Vulkan does not start.
gpu-context=winvk,d3d11
# Hardware decoding through D3D11 for everything, rendered on Vulkan. Never
# vulkan (or auto): Vulkan video decoding lost the GPU device on FastStream
# streams (the window gone, the driver dead until a restart) and dropped frames
# on long local files - a device loss is no init failure, so the fallback list
# cannot catch it. tests/run-tests.ps1 refuses it here.
hwdec=d3d11va-copy,no

# The shader cache is portable_config/cache (gpu-shader-cache is on by default).
# A UI drawn as coloured blocks or a lost GPU device after a crash can come from
# bad cached shaders: right-click > Video > Upscale > Rebuild shaders clears
# mpv's copy; AMD keeps its own (Adrenalin > Settings > Graphics > Advanced >
# Reset Shader Cache).

# ---- Network streams ----
# Defaults for what stream-buffer.lua does not set per file (it owns
# demuxer-max-bytes/-back-bytes, cache-secs and cache-on-disk, from Settings >
# Buffering). The buffer holds compressed packets in RAM or a temp file, never VRAM.
cache=yes
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=128MiB
# wait for buffer at the start and after a stall: 3 s until settings.lua applies
# Settings > Start and stalls (Adaptive by default: the wait follows the line's
# speed). settings.lua turns cache-pause-initial off once a file has started,
# since mpv applies it after every seek too.
cache-pause-initial=yes
cache-pause-wait=3
# two more frames of presentation headroom against one slow frame (heavy
# shaders), for a little latency
swapchain-depth=4
# YouTube links (ytdl_hook, yt-dlp.exe): yt-dlp needs a JavaScript runtime for
# YouTube's challenges, or its formats go missing. Its default is Deno, which is
# winding down (a year of fixes only); Node.js, on PATH for FastStream's helper,
# does it as well. Added to Deno while both are installed; alone once Deno goes.
ytdl-raw-options-append=js-runtimes=node

# Profile sections ([name]) must stay at the END of this file: every line after
# a header belongs to that profile. There is none at the moment.
