# gpu-toggles.lua options, read once at mpv start.
#
# movie_sharpness: strength of the adaptive-sharpen pass at the end of both
# Movie upscale chains (its curve_height).
#   auto  = by how much the video is enlarged: display scale - 1, kept within
#           0.5..1.5 (1080p on 1440p -> 0.5, 720p -> 1.0, 480p -> 1.5). Measured
#           to land every tested ratio between the original master's sharpness
#           and ~13% above it - see effective_sharpness() in gpu-toggles.lua.
#   0 = off, 0.5 = Low, 1.0 = Medium, 1.5 = High; 0.3-2.0 is the useful range.
# The upscale menu's "Movie sharpness" entries change it AND remember the choice
# in ~~state/movie-sharpness.json (portable_config/), which wins over this line
# from then on. To make this line count again, delete that file.
movie_sharpness=auto
#
# quality: which chain a preset runs (Settings > Upscaling quality).
#   auto = what this PC measured: a chain that took too long per frame steps down
#          to the fast one, or off; high = always the full chains; fast = always the
#          light ones (Anime4K's low-end set, Movie without FSRCNNX).
# A quality chosen in the menu is remembered in ~~state/upscale.json (with the
# screen override and the measurements) and wins over this line the same way:
# delete that file to make this line count again.
quality=auto
#
# remember: no = remember nothing (neither file above is read or written) and
# measure nothing; every start uses the lines in this file.
remember=yes
