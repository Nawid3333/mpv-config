# input.conf - keybinds and the uosc right-click menu
# Keys override mpv defaults automatically. Delete a line to get the default back.
# The menu-comment at the end of a line places the key (or a menu-only entry) into
# uosc's right-click menu. Plain comments (no menu markup) are documentation only.

# ---- SPEED ---- (keybinds with menu titles, see menu section below)
# NOTE: q is deliberately a speed key here, so it no longer quits mpv via that
# key specifically - but plain quit was never actually lost: mpv's OWN default
# bindings for it are q, Ctrl+w, AND Ctrl+c (see the mpv manual/--input-
# cmdlist), and this file only ever redefines q, not the other two. Ctrl+w /
# Ctrl+c still quit exactly as they always did. Q (quit & save position) is
# also mpv's own default and is likewise untouched. The right-click menu's
# Quit group (see the bottom of this file) just needed its label corrected to
# stop claiming "(q)" for a key that no longer does that - 2026-09-14.
# Speed changes are also PERSISTED: every speed change (keys here, the uosc
# speed button, [ ] { } etc.) is written to portable_config/speed.json by
# Scripts/remember-speed.lua and re-applied on the next mpv launch and the
# next file - see that script's header for why watch-later was not used.
#
# The preset keys (r/g/b/q/w/a/y/e/h) go through Scripts/speed-presets.lua:
# pressing a preset sets its speed; pressing the SAME key again reverts to the
# speed that was active just before it took effect (memory is per key, for the
# current session - see that script's header). r is the 1x preset - "reset"
# that toggles back, like every other preset key. s/d stay plain +/-0.1 (and
# [ ] { } and the uosc speed slider likewise) - they are adjustments, not
# presets, so the toggle target does not follow them; they just become whatever
# the next preset press reverts to. The menu entries below match that behavior.
# Every speed change shows the same small banner top right (Scripts/notify.lua):
# s/d and the menu's extra speeds change speed with no-osd and ask
# speed-button.lua to show it (script-message-to speed_button show-speed).
s       no-osd add speed -0.1; script-binding uosc/flash-speed; script-message-to speed_button show-speed   #! Playback > Speed > -0.1
d       no-osd add speed 0.1;  script-binding uosc/flash-speed; script-message-to speed_button show-speed   #! Playback > Speed > +0.1
r       script-binding speed_presets/preset 1        #! Playback > Speed > 1x / Reset (press again to revert)
g       script-binding speed_presets/preset 2        #! Playback > Speed > 2x (press again to revert)
b       script-binding speed_presets/preset 2.5      #! Playback > Speed > 2.5x (press again to revert)
q       script-binding speed_presets/preset 3        #! Playback > Speed > 3x (press again to revert)
w       script-binding speed_presets/preset 3.5      #! Playback > Speed > 3.5x (press again to revert)
a       script-binding speed_presets/preset 4        #! Playback > Speed > 4x (press again to revert)
y       script-binding speed_presets/preset 5        #! Playback > Speed > 5x (press again to revert)
e       script-binding speed_presets/preset 8        #! Playback > Speed > 8x (press again to revert)
h       script-binding speed_presets/preset 16       #! Playback > Speed > 16x (press again to revert)

# ---- SEEK ---- (keybinds with menu titles, see menu section below)
# No seek key flashes the uosc timeline or draws OSD (2026-09-25): silent, like FastStream's
# seek keys. Hover the bottom edge to see the timeline.
# z/x (±60s) stay KEYFRAME seeks (no `exact` flag): on a long hop the snap to
# the nearest keyframe is proportionally tiny and the seek stays instant even
# on a network stream (no forward-decode). j/k and left/right are the SHORT
# hops and are EXACT (hr) seeks: a keyframe-snap on a 5s/10s skip can overshoot
# by the whole GOP - measured 2026-09-21 on a 10s-keyframe test clip: +5
# actually landed +9.3, -10 landed -13.7 - which is what made the arrow keys
# feel like ~12s (see doc/history/sessions-2026-09.md, 2026-09-21 seek section).
# Exact costs a short forward-decode from the keyframe before the target
# (probe 2026-09-21: every hop applied and playback resumed within ~0.4s on a
# local file; on a stream the same applies whenever the target is inside the
# already-fetched cache, which it virtually always is).
z       no-osd seek -60   #! Playback > Seek > Back 60s
x       no-osd seek 60   #! Playback > Seek > Forward 60s
j       no-osd seek -10 exact   #! Playback > Seek > Back 10s
k       no-osd seek 10 exact   #! Playback > Seek > Forward 10s

# ---- FRAME STEP ----
# mpv's own default for `.` calls frame-step with its default "play" flag,
# which literally unpauses, renders exactly one frame, then re-pauses - so
# every press flashes play then pause (visible as uosc's pause-indicator
# blinking twice, i.e. looks like it "also does play/pause"). `,` never had
# this problem because mpv hardcodes frame-back-step to the "seek" flag
# (an exact seek, no unpause). Force `.` onto that same "seek" flag so both
# keys behave identically: step exactly one frame and stay paused, no flash.
.       frame-step 1 seek  #! Playback > Frame step > Forward
,       frame-back-step    #! Playback > Frame step > Back

# ---- PERCENT SEEK (YouTube-style: number key N jumps to N*10% of file) ----
# Overrides mpv's stock 0-9 = contrast/brightness/gamma/saturation/volume.
0       no-osd seek 0  absolute-percent  #! Playback > Seek > Jump to 0%
1       no-osd seek 10 absolute-percent  #! Playback > Seek > Jump to 10%
2       no-osd seek 20 absolute-percent  #! Playback > Seek > Jump to 20%
3       no-osd seek 30 absolute-percent  #! Playback > Seek > Jump to 30%
4       no-osd seek 40 absolute-percent  #! Playback > Seek > Jump to 40%
5       no-osd seek 50 absolute-percent  #! Playback > Seek > Jump to 50%
6       no-osd seek 60 absolute-percent  #! Playback > Seek > Jump to 60%
7       no-osd seek 70 absolute-percent  #! Playback > Seek > Jump to 70%
8       no-osd seek 80 absolute-percent  #! Playback > Seek > Jump to 80%
9       no-osd seek 90 absolute-percent  #! Playback > Seek > Jump to 90%

# ---- SUBTITLES ----
# c = smart subtitle key (subtitle-toggle script):
#   no subs -> scans video folder and loads one if found, else "No subtitles"
#   subs loaded -> toggle show/hide
c       script-binding subtitle_toggle/smart-toggle    #! Subtitles > Smart toggle

# ---- FILE INFO ----
# page 1 shows: name, size, duration, codecs, resolution, fps, bitrate
i       script-binding stats/display-page-1        #! Tools > Stats > File info (4s)
# I stays open; pages 1-5/0 while open, ESC closes
I       script-binding stats/display-stats-toggle  #! Tools > Stats > Toggle overlay

# ---- GPU SHADERS ----
# Handled by gpu-toggles.lua so key + menu + uosc toolbar button share one
# source of truth. One key per preset (2026-09-24): Shift+A toggles Anime
# on/off, Shift+Y toggles Movie on/off. Pressing the other preset's key while
# one is on switches straight to the other (the shader list is replaced, never
# stacked). "On" means that chain is running, so Auto having picked Anime for
# a FastStream anime stream counts as Anime on. The full cycle (Off -> Auto ->
# Anime -> Movie; Auto only for FastStream content) is the toolbar button's
# left-click and the menu entry below; right-click on the button opens a menu.
# Frame interpolation (Ctrl+i / RIFE) was removed entirely 2026-09-20.
Shift+A  script-binding gpu_toggles/toggle-anime  #! Video > Shaders > Anime on/off
Shift+Y  script-binding gpu_toggles/toggle-movie  #! Video > Shaders > Movie on/off

# ---- MOUSE / UI (uosc) ----
# right-click = uosc settings menu (overrides mpv's context menu)
mbtn_right  script-binding uosc/menu
menu        script-binding uosc/menu
# toggle whole UI (peek remaining time etc.)
tab         script-binding uosc/toggle-ui
# Del is intentionally left unbound/free (was a duplicate of tab)
#
# left-click on the VIDEO = play/pause toggle, like a normal player. uosc's own
# mouse handling takes priority where its UI is: it grabs mbtn_left wherever an
# element is drawn (its decide_keybinds() disables its binding groups over plain
# video, level 0), so this binding only ever fires over bare video - clicks on
# the timeline/controls/menus still do UI things. The binding fires on button
# RELEASE. mpv.conf sets window-dragging=no (2026-09-26): with dragging on, any
# press that moved 3 px before release was turned into a window drag and the
# click was dropped - even in fullscreen, where no drag can happen. The window
# moves by its native title bar (mpv.conf border=yes, full Windows 11 snapping)
# or PowerToys GrabAndMove (Alt+drag).
mbtn_left   cycle pause; script-binding uosc/flash-pause-indicator
# double-click on the video = fullscreen (mpv's stock default does this via its
# builtin MBTN_LEFT_DBL; keeping it explicit here so the single-click toggle
# above cannot swallow it - double-click still wins over single-click within
# --input-doubleclick-time, mpv's core fires the dbl binding before the singles
# finish).
mbtn_left_dbl cycle fullscreen

# wheel + up/down = volume, feedback via uosc volume bar flash (no OSD text)
# up/down step 10 (2026-09-25), the same as FastStream's Up/Down (+/-10%, KeybindManager
# VolumeUp/VolumeDown); the wheel stays the finer 2.
wheel_up    no-osd add volume 2;  script-binding uosc/flash-volume
wheel_down  no-osd add volume -2; script-binding uosc/flash-volume
up          no-osd add volume 10;  script-binding uosc/flash-volume
down        no-osd add volume -10; script-binding uosc/flash-volume
m           no-osd cycle mute;    script-binding uosc/flash-volume

# left/right = 5s skip (j/k do the 10s), silent like every seek key (see the SEEK section).
# EXACT seeks (see the SEEK section above for why: keyframe-snap overshoot).
left        no-osd seek -5 exact
right       no-osd seek 5 exact

# f fullscreen, SPACE pause: mpv defaults, intentionally not redefined.

# ---- EXPLICITLY DISABLED DEFAULTS ----
# These stock mpv keys survived our remaps above as confusing leftovers: the
# base key was given a new job (speed/seek/etc.) but its Shift-modified or
# duplicate sibling still silently does the OLD stock action, since only the
# exact key defined above gets overridden. Each of these has its function
# covered elsewhere (another key or the uosc menu), so they're just blocked
# with `ignore` rather than left dangling. Delete a line below to restore
# that key's stock mpv behavior.
BS  ignore  # was speed-reset; redundant, r already does this (Playback > Speed > Reset)
Z   ignore  # was sub-delay +0.1s; z now seeks -60s. Same action is in the menu (Subtitles > Timing > +0.1s)
R   ignore  # was move-subtitle down; r now resets speed. Same action added to the menu (Subtitles > Position > Down)
W   ignore  # was increase pan-and-scan; w now sets speed 3.5x. Same action is in the menu (Video > Zoom > Pan-scan crop +)

# ---- SUBTITLE & AUDIO SYNC ----
# t was freed above (discouraged legacy duplicate of R) and is repurposed
# here: opens/closes the sync timeline (subtitle-sync.lua, a port of
# FastStream's resync tool): a strip of the timeline around the playhead
# with the sound (speech shows as blobs) and every subtitle line as a block.
# Drag the subtitle row onto the speech (sub-delay), drag the audio row
# (audio-delay), drag the time row to scrub, click to jump, wheel = 0.05 s;
# Left/Right = subtitles, Shift+Left/Right = audio. Enter/t keeps, Esc puts
# both back. Also the uosc toolbar sync icon and Audio > Timing below.
t   script-binding subtitle_sync/toggle  #! Subtitles > Sync tool: subtitles + audio timeline (t)

