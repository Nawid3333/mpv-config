# input.conf - keybinds and the uosc right-click menu
# A key here overrides mpv's default for that key; delete a line to get the
# default back. A trailing menu comment (hash, exclamation mark, "Menu > Item")
# puts the line into uosc's right-click menu; a line that starts with a hash and
# has one is a menu-only entry (no key). Menu order = file order. Never write
# that marker in a plain comment: uosc would show the comment as a menu item.

# ---- Speed ----
# The preset keys (r g b q w a y e h) go through speed-presets.lua: a preset sets
# its speed, the SAME key again goes back to the speed before it (per key, per
# session); r is the 1x preset. s/d and the menu's extra speeds are adjustments,
# not presets. Every speed change shows the speed banner (top left): s/d change
# the speed with no-osd and ask speed-button.lua to show it. remember-speed.lua
# keeps the speed across files and runs.
# q is a speed key: quit is Ctrl+w or Ctrl+c (mpv's own), Q quits and saves the position.
s       no-osd add speed -0.1; script-binding uosc/flash-speed; script-message-to speed_button show-speed   #! Playback > Speed > -0.1
d       no-osd add speed 0.1;  script-binding uosc/flash-speed; script-message-to speed_button show-speed   #! Playback > Speed > +0.1
r       script-binding speed_presets/preset 1        #! Playback > Speed > 1x / Reset (press again to revert)
g       script-binding speed_presets/preset 2        #! Playback > Speed > 2x (press again to revert)
b       script-binding speed_presets/preset 2.5      #! Playback > Speed > 2.5x (press again to revert)
q       script-binding speed_presets/preset 3        #! Playback > Speed > 3x (press again to revert)
w       script-binding speed_presets/preset 3.5      #! Playback > Speed > 3.5x (press again to revert)
a       script-binding speed_presets/preset 4        #! Playback > Speed > 4x (press again to revert)
y       script-binding speed_presets/preset 5        #! Playback > Speed > 5x (press again to revert)
e       script-binding speed_presets/preset 8        #! Playback > Speed > 8x (press again to revert)
h       script-binding speed_presets/preset 16       #! Playback > Speed > 16x (press again to revert)

# ---- Seek ----
# Every seek is an instant keyframe seek, without OSD text: no forward-decode, at
# the cost of landing up to one keyframe interval off the target on files with
# few keyframes. Absolute seeks (the number keys) are exact unless told
# `keyframes`. A static check keeps `exact` out of the seek keys.
# Each seek key shows uosc's timeline for 2.5 s (flash-elements with its own
# duration, a local uosc change; uosc.conf's flash_duration stays the volume's
# and the pause's), so a skip shows where in the file it landed.
z       no-osd seek -60; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Back 60s
x       no-osd seek 60; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Forward 60s
j       no-osd seek -10; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Back 10s
k       no-osd seek 10; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Forward 10s

# ---- Frame step ----
# `.` with the "seek" flag like `,`: one frame, stays paused (mpv's default
# "play" flag unpauses for a frame, which blinks uosc's pause indicator).
.       frame-step 1 seek  #! Playback > Frame step > Forward
,       frame-back-step    #! Playback > Frame step > Back

# ---- Percent seek: key N jumps to N x 10% (replaces mpv's 0-9 picture keys) ----
0       no-osd seek 0  absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 0%
1       no-osd seek 10 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 10%
2       no-osd seek 20 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 20%
3       no-osd seek 30 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 30%
4       no-osd seek 40 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 40%
5       no-osd seek 50 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 50%
6       no-osd seek 60 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 60%
7       no-osd seek 70 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 70%
8       no-osd seek 80 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 80%
9       no-osd seek 90 absolute-percent+keyframes; script-message-to uosc flash-elements timeline 2500  #! Playback > Seek > Jump to 90%

# ---- Subtitles ----
# c: no subtitles yet -> load one from the video's folder; else show/hide
c       script-binding subtitle_toggle/smart-toggle    #! Subtitles > Smart toggle

# ---- File info ----
i       script-binding stats/display-page-1        #! Tools > Stats > File info (4s)
# I stays open; pages 1-5/0 while open, Esc closes
I       script-binding stats/display-stats-toggle  #! Tools > Stats > Toggle overlay

# ---- Upscaling (gpu-toggles.lua owns the state) ----
# Shift+A / Shift+Y switch Anime / Movie on and off; the other key while one runs
# switches straight across. Auto having picked Anime counts as Anime on. The full
# cycle (Off -> Auto -> Anime -> Movie) is the toolbar button and Video > Upscale.
Shift+A  script-binding gpu_toggles/toggle-anime  #! Video > Upscale > Anime on/off
Shift+Y  script-binding gpu_toggles/toggle-movie  #! Video > Upscale > Movie on/off
# Shift+S tunes what runs, without the menu: Anime's lines (Crisp / As drawn), Movie's
# sharpness (Auto, Off, Low, Medium, High); a banner lists the choices.
Shift+S  script-binding gpu_toggles/cycle-tuning  #! Video > Upscale > Anime lines / Movie sharpness: next

# ---- Mouse and UI ----
mbtn_right  script-binding uosc/menu
menu        script-binding uosc/menu
tab         script-binding uosc/toggle-ui
# A click on bare video toggles pause (uosc takes the clicks over its own UI).
# It fires on release; mpv.conf window-dragging=no keeps a slightly moved click
# from turning into a window drag. No pause-indicator flash with it: it faded over 300 ms
# (his pick, 2026-10-14: everything instant); the state shows in the bar.
# faststream-pause: as Space below.
mbtn_left   cycle pause; script-message faststream-pause
# explicit, so the single-click binding above cannot swallow the double-click
mbtn_left_dbl cycle fullscreen

# Volume: the wheel steps 2, Up/Down step 10 (like FastStream); feedback is
# uosc's volume bar, no OSD text.
wheel_up    no-osd add volume 2;  script-binding uosc/flash-volume
wheel_down  no-osd add volume -2; script-binding uosc/flash-volume
up          no-osd add volume 10;  script-binding uosc/flash-volume
down        no-osd add volume -10; script-binding uosc/flash-volume
m           no-osd cycle mute;    script-binding uosc/flash-volume

# Left/Right skip 5 s, like the other seek keys.
left        no-osd seek -5; script-message-to uosc flash-elements timeline 2500
right       no-osd seek 5; script-message-to uosc flash-elements timeline 2500

# f (fullscreen) is mpv's own. Space pauses as in mpv, and also tells the FastStream
# helper (faststream-pause): at an episode's end it stops the autoplay countdown,
# leaving autoplay on for the next end (FastStream's extension acts on it; mpv
# stays paused on the last frame). No helper, or no countdown: nothing more.
SPACE       cycle pause; script-message faststream-pause

# ---- Disabled defaults ----
# Siblings of keys that got a new job above would still do their old stock
# action; each of those actions is in the menu.
BS  ignore  # was speed-reset; redundant, r already does this (Playback > Speed > 1x / Reset)
Z   ignore  # was sub-delay +0.1s; z now seeks -60s. Same action is in the menu (Subtitles > Timing > +0.1s)
R   ignore  # was move-subtitle down; r now resets speed. Same action added to the menu (Subtitles > Position > Down)
W   ignore  # was increase pan-and-scan; w now sets speed 3.5x. Same action is in the menu (Video > Zoom > Pan-scan crop +)

# ---- Subtitle and audio sync ----
# t opens the sync timeline (subtitle-sync.lua): the sound and every subtitle
# line around the playhead. Drag the subtitle row onto the speech (sub-delay),
# the audio row (audio-delay), the time row to scrub; wheel = 0.05 s; Left/Right
# move subtitles, Shift+Left/Right audio; Enter/t keeps, Esc puts both back.
t   script-binding subtitle_sync/toggle  #! Subtitles > Sync tool: subtitles + audio timeline (t)

