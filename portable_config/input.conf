#   #! Playlist > ---
#   script-binding uosc/playlist  #! Playlist > Show playlist
#   script-binding uosc/open-file #! Playlist > Open file...
#   script-binding uosc/next      #! Playlist > Next
#   script-binding uosc/prev      #! Playlist > Previous
# Episodes: the FastStream helper that started this mpv hears these messages (next /
# previous episode, autoplay on/off); without one, faststream-episodes.lua plays the
# playlist's next / previous file (a local file's folder: autoload.lua queues it), or
# says there is none. The same three are buttons in the control bar while FastStream
# follows the window. Shift+N / Shift+P, and a keyboard's media keys (Next / Previous
# track: NEXT / PREV, also with the window in the background, through Windows' media
# controls); n is next too. Ctrl+a is free in mpv's and every script's bindings
# (test-faststream-episodes.lua checks it).
Shift+N  script-message faststream-next      #! Playlist > Next episode
Shift+P  script-message faststream-previous  #! Playlist > Previous episode
n        script-message faststream-next
NEXT     script-message faststream-next
PREV     script-message faststream-previous
Ctrl+a  script-message faststream-autoplay  #! Playlist > Autoplay next episode (FastStream)
#   script-binding uosc/shuffle   #! Playlist > Shuffle mode
#   playlist-clear                #! Playlist > Clear

